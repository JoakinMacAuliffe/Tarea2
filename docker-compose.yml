# ============================================================
# Tarea 3 - Taller de Redes y Servicios
# Stack: RabbitMQ (AMQP) + cliente amqp-tools + contenedor Scapy
# ============================================================

services:

  # ── 1. Servidor RabbitMQ ────────────────────────────────────
  rabbit_server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: rabbit_server
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI  (admin / 1234)
    networks:
      - amqp_net
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── 2. Cliente AMQP (amqp-tools) ───────────────────────────
  amqp_client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: amqp_client
    networks:
      - amqp_net
    depends_on:
      rabbit_server:
        condition: service_healthy
    # Queda en bash interactivo; usa -it para publicar/consumir mensajes:
    #   docker compose run --rm amqp_client \
    #     amqp-publish -u "amqp://admin:1234@rabbit_server:5672/entorno_amqp" \
    #                  -r hello -b "Hola Mundo"
    stdin_open: true
    tty: true
    command: ["/bin/bash"]

  # ── 3. Contenedor Scapy (Tarea 3) ──────────────────────────
  scapy_tarea3:
    build:
      context: .          # raiz del proyecto (donde esta tarea3.py)
      dockerfile: scapy/Dockerfile
    container_name: scapy_tarea3
    networks:
      - amqp_net
    depends_on:
      rabbit_server:
        condition: service_healthy
    environment:
      AMQP_HOST: rabbit_server   # nombre del servicio interno
      AMQP_PORT: "5672"
    # Privilegiado para que Scapy pueda usar raw sockets / pcap
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # Monta el directorio de trabajo para recuperar los archivos de salida:
    #   resultados_analisis.txt  y  metricas_throughput.png
    volumes:
      - ./output:/app/output
    # Crea el directorio de salida antes de ejecutar
    command: >
      sh -c "mkdir -p /app/output &&
             python3 -u tarea3.py"

networks:
  amqp_net:
    driver: bridge
